# Installed with desklinkd: arm Wake-on-LAN (magic packet) on wired
# connections, so the DeskLink app can wake this computer. A connection with
# its own ethernet.wake-on-lan setting keeps it. Takes effect whenever a
# wired connection comes up.
[connection-desklink-wake-on-lan]
match-device=type:ethernet
ethernet.wake-on-lan=magic
